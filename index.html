<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noa Roggendorff</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div class="profile-container">
      <div class="container">
        <img src="assets/user.png" class="profile-image" alt="Profile Image" />
        <h1>Noa Roggendorff</h1>
        <p class="bio">yet another dev</p>
        <div class="social-links">
          <a
            href="https://github.com/nroggendorff/sly.sh"
            target="_parent"
            title="GitHub"
          >
            <span class="icon github" role="img" aria-label="GitHub"></span>
          </a>
          <a
            href="https://hf.co/spaces/nroggendorff/nroggendorff"
            target="_parent"
            title="Hugging Face"
          >
            <span
              class="icon huggingface"
              role="img"
              aria-label="HuggingFace"
            ></span>
          </a>
          <a
            href="https://bsky.app/profile/sly.sh"
            target="_parent"
            title="BlueSky"
          >
            <span class="icon bluesky" role="img" aria-label="BlueSky"></span>
          </a>
        </div>

        <script type="text/javascript">
          function checkBioChange() {
            const bio = document.querySelector(".bio");
            if (Math.random() * 100 <= 2) {
              bio.innerHTML = "Esmy still lingers in my dreams.";
            }
          }

          window.addEventListener("load", checkBioChange);
        </script>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
